# Configuration for the Snakemake pipeline.
#
# raw_data_dir is the directory holding the raw data, with one
# subdirectory per sample (main for the adults, child for the children),
# each containing the .bdf and .json files. The raw data is not part of
# this repository. Point this at wherever it is on your system, either
# here or on the command line with --config raw_data_dir=/some/path.
# A relative path is taken relative to the repository root.
raw_data_dir: ../purple-raw-data/data
